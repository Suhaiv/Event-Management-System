<template>

    <lightning-card>

        <!-- Upcoming Header -->
        <div class="upcoming-header">

            <div class="upcoming-icon">
                <lightning-icon icon-name="standard:event" size="small" alternative-text="Upcoming Events">
                </lightning-icon>
            </div>

            <div>
                <h2>Upcoming live events</h2>
                <template if:true={hasEvents}>
                    <p class="subheading">{totalEvents} events scheduled across {locationSummary}</p>
                </template>
                <template if:false={hasEvents}>
                    <p class="subheading">No live events scheduled</p>
                </template>
            </div>

        </div>

        <div class="event-container">

            <div class="stats-row">

                <!-- Total Events -->
                <div class="stat-card total-card">
                    <p class="stat-label">
                        <lightning-icon icon-name="utility:kanban" size="xx-small">
                        </lightning-icon>
                        <span>Total events</span>
                    </p>
                    <p class="stat-value">{totalEvents}</p>
                </div>

                <!-- This Week -->
                <div class="stat-card week-card">
                    <p class="stat-label">
                        <lightning-icon  icon-name="utility:clock" size="xx-small">
                        </lightning-icon>
                        <span>This week</span>
                    </p>
                    <p class="stat-value">{thisWeekCount}</p>
                </div>

                <!-- In-Person -->
                <div class="stat-card inperson-card">
                    <p class="stat-label">
                        <lightning-icon icon-name="utility:location" size="xx-small">
                        </lightning-icon>
                        <span>In-person</span>
                    </p>
                    <p class="stat-value">{inPersonCount}</p>
                </div>

                <!-- Virtual -->
                <div class="stat-card virtual-card">
                    <p class="stat-label">
                        <lightning-icon icon-name="utility:video" size="xx-small">
                        </lightning-icon>
                        <span>Virtual</span>
                    </p>
                    <p class="stat-value">{virtualCount}</p>
                </div>

            </div>

            <div class="search-section">

                <div class="search-input">

                    <div class="search-label">
                        Search Event
                    </div>

                    <div class="input-wrapper">

                        <lightning-icon icon-name="utility:search" size="x-small" alternative-text="Search">
                        </lightning-icon>

                        <input
                type="search"
                class="custom-input"
                placeholder="Search by event name or location"
                value={searchKey}
                oninput={handleSearch}>


                    </div>

                </div>


                <button
    class="custom-search-button"
    onclick={searchEvents}>

    <lightning-icon
        class="search-button-icon"
        icon-name="utility:search"
        size="x-small"
        alternative-text="Search">
    </lightning-icon>

    <span>Search</span>

</button>

            </div>

            <!-- Event Rows -->
            <div class="table-container">
                <template for:each={eventData} for:item="event">
                    <div class="event-row" key={event.Id}>

                        <div class="row-icon" style={event.iconBg}>
                            <lightning-icon icon-name={event.iconName} size="x-small">
                            </lightning-icon>
                        </div>

                        <a href={event.recordUrl} class="event-name">{event.eventName}</a>

                        <span class="event-date">
                            <lightning-icon icon-name="utility:date_input" size="xx-small"></lightning-icon>
                            {event.formattedDate}
                        </span>

                        <span class={event.badgeClass}>{event.Event_Type__c}</span>

                        <span class="event-location">
                            <lightning-icon icon-name="utility:location" size="xx-small"></lightning-icon>
                            {event.locationName}
                        </span>

                    </div>
                </template>

                <template if:false={hasEvents}>
                    <div class="empty-state">No events found.</div>
                </template>
            </div>

        </div>

    </lightning-card>

</template>
