<template>
    <lightning-card title="Create A Event Record" icon-name="action:new_event">
        <div class="form-container">
              <template if:true={isLoading}>
            <lightning-spinner alternative-text="Saving..." size="large">
            </lightning-spinner>
            </template>
            <lightning-record-edit-form object-api-name={objectApiName} density="compact" onsuccess={handleSuccess} onerror={handleError}>

                <div class="field">
                    <label class="customLabel">Name</label>
                    <lightning-input-field field-name={fieldName} variant="label-hidden"></lightning-input-field>
                </div>

                <div class="field">
                    <label class="customLabel">Organizer</label>
                    <lightning-input-field field-name={fieldOrganizer} variant="label-hidden"></lightning-input-field>
                </div>

                <div class="field">
                    <label class="customLabel">Start</label>
                    <lightning-input-field field-name={fieldStart} variant="label-hidden"></lightning-input-field>
                </div>

                <div class="field">
                    <label class="customLabel">End</label>
                    <lightning-input-field field-name={fieldEnd} variant="label-hidden"></lightning-input-field>
                </div>

                <div class="field">
                    <label class="customLabel">Location (Event)</label>
                    <lightning-input-field
                        field-name={fieldLocation}
                        data-id="amount"
                        variant="label-hidden">
                    </lightning-input-field>
                </div>

                <div class="field">
                    <label class="customLabel">Max Seats</label>
                    <lightning-input-field field-name={fieldMaxseat} variant="label-hidden"></lightning-input-field>
                </div>
                 
                <div class="field">
                    <label class="customLabel">Event Type</label>
                    <lightning-input-field field-name={fieldEventType} variant="label-hidden"></lightning-input-field>
                </div>
                
                <div class="field">
                    <label class="customLabel">Live</label>
                    <lightning-input-field field-name={fieldLive} variant="label-hidden"></lightning-input-field>
                </div>
                
                <lightning-button label="Submit" variant="brand" onclick={click}></lightning-button>

            </lightning-record-edit-form>

        </div>
    </lightning-card>
</template>
